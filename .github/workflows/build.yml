name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: mvn verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      # Builds the versions declared in pom.xml (not the ci-community profile), so a Lightwell
      # remediation PR is built and tested with the Lightwell versions it proposes.
      - name: Verify
        run: mvn -B -q verify
