name: Lightwell Remediate

# Thin caller — plugin implementation lives in lightwell-github-plugin-demo
on:
  workflow_dispatch:
  push:
    paths:
      - "**/pom.xml"
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  remediate:
    uses: anurag-saran/lightwell-github-plugin-demo/.github/workflows/lightwell-remediate.yml@main
    secrets: inherit
