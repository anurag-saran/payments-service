name: Lightwell Remediate

# Dependabot-style: auto-scan for Lightwell matches and open a PR.
# Developer merges to accept, or closes to reject.
on:
  workflow_dispatch:
  push:
    paths:
      - "**/pom.xml"
      - "lightwell-github/catalog.json"
      - ".github/workflows/lightwell-remediate.yml"
  schedule:
    - cron: "0 9 * * 1"

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: lightwell-remediate
  cancel-in-progress: true

jobs:
  remediate:
    name: Scan and open remediation PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan pom.xml files
        id: scan
        run: |
          python3 lightwell-github/scan_poms.py --root .
          MATCH_COUNT=$(python3 -c 'import json; print(len(json.load(open("lightwell-github/out/matches.json"))["matches"]))')
          echo "match_count=$MATCH_COUNT" >> "$GITHUB_OUTPUT"
          cat lightwell-github/out/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: No matches
        if: steps.scan.outputs.match_count == '0'
        run: echo "No Lightwell remediations available."

      - name: Apply bumps and open or update PR
        if: steps.scan.outputs.match_count != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BRANCH="lightwell/remediations"

          TITLE=$(python3 - <<'PY'
          import json
          matches = json.load(open("lightwell-github/out/matches.json"))["matches"]
          if len(matches) == 1:
              m = matches[0]
              print(f"chore(deps): remediate {m['artifactId']} to {m['toVersion']} (Lightwell)")
          else:
              print(f"chore(deps): remediate {len(matches)} dependencies to Lightwell builds")
          PY
          )

          {
            echo "## Summary"
            echo
            echo "Lightwell found matching remediated libraries and opened this PR automatically."
            echo
            echo "**Merge** to accept the update, or **close** to reject it."
            echo
            cat lightwell-github/out/report.md
            echo
            echo "## Test plan"
            echo
            echo "- [ ] Review pom.xml version bumps"
            echo "- [ ] Run \`mvn -q test\` (or project build)"
            echo "- [ ] Confirm Lightwell artifacts resolve in CI"
          } > /tmp/pr-body.md

          python3 lightwell-github/apply_bumps.py --root .

          mapfile -t POMS < <(python3 -c 'import json; print("\n".join(m["pom"] for m in json.load(open("lightwell-github/out/matches.json"))["matches"]))')

          git config user.name "lightwell-bot"
          git config user.email "lightwell-bot@users.noreply.github.com"

          # Keep working-tree bumps; create/reset branch tip from current main checkout
          git switch -C "$BRANCH"

          git add "${POMS[@]}"
          if git diff --cached --quiet; then
            echo "No pom changes to commit."
            exit 0
          fi

          git commit -m "$TITLE"
          git push -u origin "$BRANCH" --force

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          gh label create lightwell --description "Lightwell remediation proposals" --color "0E4429" 2>/dev/null || true
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" --title "$TITLE" --body-file /tmp/pr-body.md --add-label lightwell
            PR_URL=$(gh pr view "$EXISTING_PR" --json url --jq .url)
            echo "Updated PR: $PR_URL"
          else
            PR_URL=$(gh pr create --title "$TITLE" --body-file /tmp/pr-body.md --base main --head "$BRANCH" --label lightwell)
            echo "Opened PR: $PR_URL"
          fi

          {
            echo
            echo "### Lightwell remediation PR"
            echo
            echo "Opened or updated: $PR_URL"
            echo
            echo "Merge to accept, or close to reject."
          } >> "$GITHUB_STEP_SUMMARY"
